<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-size: 16px;
    color: chartreuse;
}

.photos {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}

.photos img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

@media (min-width: 768px) {
    body {
        font-size: 20px;
        color: black;
    }

    .photos {
        grid-template-columns: 1fr 1fr;
    }
}

@media (min-width: 1024px) {
    body {
        font-size: 28px;
        color: blue;
    }

    .photos {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

Everybody say SLAYYYYYYYYYY!!

<div class="photos">
    <img src="./images/trek.jpg" alt="ABC Trek">
    <img src="./images/trek.jpg" alt="ABC Trek">
    <img src="./images/trek.jpg" alt="ABC Trek">
    <img src="./images/trek.jpg" alt="ABC Trek">
</div>

</body>
</html>
