<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Photo Box</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .relative {
            position: relative;
        }

        .absolute {
            position: absolute;
        }

        .wrapper {
            width: 400px;
            height: 400px;
            border: 2px solid black;
        }

        .box {
            width: 100px;
            height: 100px;

            right: 50%;
            bottom: 50%;

            transform: translate(50px, 50px);

            overflow: hidden;

            transition:
                transform 1s ease,
                background-color 0.5s ease;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box:hover {
            background-color: green;

            transform:
                translate(50%, 50%)
                rotate(360deg)
                scale(3);

            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="wrapper relative">
        <div class="box absolute">
            <img src="images/image (1).webp" alt="Photo">

        </div>
    </div>
</body>
</html>
